        - text: "Bookstore services:"
        - table [ref=f2e84]:
          - rowgroup [ref=f2e85]:
            - row [ref=f2e86]:
              - cell "Method" [ref=f2e87]
              - cell "Parameters" [ref=f2e88]
              - cell "Description" [ref=f2e89]
            - row [ref=f2e90]:
              - cell "getItemById" [ref=f2e91]
              - cell "int" [ref=f2e92]
              - cell "Returns the Book object with the given item id. Valid id values are 1- 9, or if you add a new entry using the addNewItemToInventory method, you can retrieve a Book using the new id." [ref=f2e93]
            - row [ref=f2e94]:
              - cell "getItemByTitle" [ref=f2e95]
              - cell "string" [ref=f2e96]
              - 'cell "Returns a list of Book objects that match your title search query. The Book''s price value will increase by $1.00 every 5 invocations. Example keywords: linux, java, C++, program. Leave it blank to get ALL the books in the database." [ref=f2e97]'
            - row [ref=f2e98]:
              - cell "addItemToCart" [ref=f2e99]
              - cell "int, int, int" [ref=f2e100]
              - cell "Adds a specified amount of Books to a cart. If no cartId is given or if the cartId is equal to 0, a unique Id will be genearted for the user. All carts that are inactive for 20 minutes will be removed." [ref=f2e101]
            - row [ref=f2e102]:
              - cell "getItemsInCart" [ref=f2e103]
              - cell "int" [ref=f2e104]
              - cell "Returns a list of items that exist in the specified cart." [ref=f2e105]
            - row [ref=f2e106]:
              - cell "updateItemInCart" [ref=f2e107]
              - cell "int, int, int" [ref=f2e108]
              - cell "Update an existing order in a cart. Cannot update an order where quantity supplied is greater than the quantity in stock. Possible to update na order to have zero quantity." [ref=f2e109]
            - row [ref=f2e110]:
              - cell "submitOrder" [ref=f2e111]
              - cell "int" [ref=f2e112]
              - cell "Submits the items in a cart. This removes all the existing items in the cart and deletes the cartId." [ref=f2e113]
            - row [ref=f2e114]:
              - cell "addNewItemToInventory" [ref=f2e115]
              - cell "Book" [ref=f2e116]
              - cell "Add new book entries into the database. All new entries that are not accessed within 20 minutes will be removed from the database." [ref=f2e117]
